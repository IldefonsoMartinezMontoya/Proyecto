<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f0cf58">
    <title>Votar | Limoncio-Pelicular</title>
    <link rel="stylesheet" href="../CSS/EstilosComunes.css">
    <link rel="stylesheet" href="../CSS/VotarAhora.css">
</head>
<body>
    <header class="site-header">
        <nav class="site-nav" aria-label="Navegación principal">
            <a class="site-brand" href="../Home.html" aria-current="page">Limoncio-Pelicular</a>
            <div class="site-nav-links">
                <a href="Aplicacion.html">Aplicación</a>
                <a href="Peliculas.html">Películas</a>
                <a href="Preguntas.html">Preguntas frecuentes</a>
                <a href="SobreNosotros.html">Sobre nosotros</a>
                <a href="Soporte.html">Soporte</a>
            </div>
        </nav>
    </header>

    <main class="page-shell">
        <section class="panel hero-panel">
            <h1>Hora de votar!</h1>
            <form>
                <fieldset class="generos">
                    <legend>Elige que generos te interesan</legend>

                    <table>
                        <tr>
                            <td>
                                <div class="genero">
                                    <input type="checkbox" id="accion" name="accion" value="accion"/>
                                    <label for="accion">Acción</label>
                                </div>
                            </td>
                            <td>
                                <div class="genero">
                                    <input type="checkbox" id="terror" name="terror" value="terror"/>
                                    <label for="terror">Terror</label>
                                </div>
                            </td>
                            <td>
                                <div class="genero">
                                    <input type="checkbox" id="comedia" name="comedia" value="comedia"/>
                                    <label for="comedia">Comedia</label>
                                </div>
                            </td>
                            <td>
                                <div class="genero">
                                    <input type="checkbox" id="aventura" name="aventura" value="aventura"/>
                                    <label for="aventura">Aventura</label>
                                </div>
                            </td>
                            <td>
                                <div class="genero">
                                    <input type="checkbox" id="thriller" name="thriller" value="thriller"/>
                                    <label for="thriller">Thriller</label>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                    <div class="genero">
                                        <input type="checkbox" id="romance" name="romance" value="romance"/>
                                        <label for="romance">Romance</label>
                                    </div>
                            </td>
                            <td>
                                <div class="genero">
                                    <input type="checkbox" id="drama" name="drama" value="drama"/>
                                    <label for="drama">Drama</label>
                                </div>
                            </td>
                            <td>
                                <div class="genero">
                                    <input type="checkbox" id="animada" name="animada" value="animada"/>
                                    <label for="animada">Animada</label>
                                </div>
                            </td>
                            <td>       
                                <div class="genero">
                                    <input type="checkbox" id="sci-fi" name="sci-fi" value="sci-fi"/>
                                    <label for="sci-fi">Sci-fi</label>
                                </div>
                            </td>
                            <td>
                                <div class="genero">
                                    <input type="checkbox" id="fantasia" name="fantasia" value="fantasia"/>
                                    <label for="fantasia">Fantasia</label>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <div class="genero">
                                    <input type="checkbox" id="documental" name="documental" value="documental"/>
                                    <label for="documental">Documental</label>
                                </div>
                            </td>
                            <td>
                                <div class="genero">
                                    <input type="checkbox" id="belica" name="belica" value="belica"/>
                                    <label for="belica">Belica</label>
                                </div>
                            </td>
                            <td>
                                <div class="genero">
                                    <input type="checkbox" id="historica" name="historica" value="historica"/>
                                    <label for="historica">Historica</label>
                                </div>
                            </td>
                            <td>
                                <div class="genero">
                                    <input type="checkbox" id="musical" name="musical" value="musical"/>
                                    <label for="musical">Musical</label>
                                </div>
                            </td>
                            <td>
                                <div class="genero">
                                    <input type="checkbox" id="psicologica" name="psicologica" value="psicologica"/>
                                    <label for="psicologica">Psicologica</label>
                                </div>
                            </td>
                        </tr>
                    </table>
                </fieldset>
                <br>
                <a class="boton" href="submit">Enviar los votos</span></a>
            </form>
        </section>
    </main>
</body>
</html>
