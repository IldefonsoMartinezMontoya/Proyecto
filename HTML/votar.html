<!DOCTYPE html>
<!-- Formulario para elegir géneros de películas. -->
<html lang="es">
<!-- Metadatos, título y hojas de estilo de esta página. -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f0cf58">
    <title>Votar | Limoncio-Pelicular</title>
    <link rel="stylesheet" href="../CSS/EstilosComunes.css">
    <link rel="stylesheet" href="../CSS/VotarAhora.css">
</head>
<body>
    <!-- Cabecera compartida: marca y navegación principal. -->
    <header class="site-header">
        <nav class="site-nav" aria-label="Navegación principal">
            <a class="site-brand" href="Home.html">Limoncio-Pelicular</a>
            <div class="site-nav-links">
                <a href="Aplicacion.html">Aplicación</a>
                <a href="Peliculas.html">Películas</a>
                <a href="Preguntas.html">Preguntas frecuentes</a>
                <a href="SobreNosotros.html">Sobre nosotros</a>
                <a href="Soporte.html">Soporte</a>
                <a href="Salas.html">Salas</a>
            </div>
        </nav>
        <nav class="usuario" aria-label="Navegación principal">
            <input type="checkbox" id="menuUsuario">

            <label for="menuUsuario">
                <img src="..\Imagenes/UserIcon.svg" alt="Menú de usuario">
            </label>

            <div class="opcionesUsuario">
                <a href="IniciarSesion.html">Iniciar sesión</a>
                <a href="Registrarse.html">Registrarse</a>
            </div>
        </nav>
    </header>

    <!-- Contenido central, envuelto para mantener el ancho común del sitio. -->
    <main class="page-shell">
        <section class="panel hero-panel votar-panel">
            <p class="eyebrow">Decidid juntos</p>
            <h1>Vota el género</h1>
            <p id="estadoVoto" class="estado-voto" role="status" aria-live="polite">Comprobando tu sala…</p>
            <form id="formularioVotacion" hidden>
                <fieldset class="generos">
                    <legend>Elige un género. Cada participante dispone de un voto.</legend>
                    <div class="generos-grid">
                        <div class="genero"><input type="radio" id="accion" name="genero" value="Acción" required><label for="accion">Acción</label></div>
                        <div class="genero"><input type="radio" id="miedo" name="genero" value="Miedo"><label for="miedo">Miedo</label></div>
                        <div class="genero"><input type="radio" id="comedia" name="genero" value="Comedia"><label for="comedia">Comedia</label></div>
                        <div class="genero"><input type="radio" id="aventura" name="genero" value="Aventura"><label for="aventura">Aventura</label></div>
                        <div class="genero"><input type="radio" id="thriller" name="genero" value="Thriller"><label for="thriller">Thriller</label></div>
                        <div class="genero"><input type="radio" id="romance" name="genero" value="Romance"><label for="romance">Romance</label></div>
                        <div class="genero"><input type="radio" id="drama" name="genero" value="Drama"><label for="drama">Drama</label></div>
                        <div class="genero"><input type="radio" id="animada" name="genero" value="Animada"><label for="animada">Animada</label></div>
                        <div class="genero"><input type="radio" id="scifi" name="genero" value="Sci-fi"><label for="scifi">Sci-fi</label></div>
                        <div class="genero"><input type="radio" id="fantasia" name="genero" value="Fantasía"><label for="fantasia">Fantasía</label></div>
                        <div class="genero"><input type="radio" id="documental" name="genero" value="Documental"><label for="documental">Documental</label></div>
                        <div class="genero"><input type="radio" id="belica" name="genero" value="Bélica"><label for="belica">Bélica</label></div>
                        <div class="genero"><input type="radio" id="historica" name="genero" value="Histórica"><label for="historica">Histórica</label></div>
                        <div class="genero"><input type="radio" id="musical" name="genero" value="Musical"><label for="musical">Musical</label></div>
                        <div class="genero"><input type="radio" id="western" name="genero" value="Western"><label for="western">Western</label></div>
                        <div class="genero"><input type="radio" id="psicologica" name="genero" value="Psicológica"><label for="psicologica">Psicológica</label></div>
                        <div class="genero"><input type="radio" id="clasica" name="genero" value="Clásica"><label for="clasica">Clásica</label></div>
                    </div>
                </fieldset>
                <button id="guardarVoto" class="boton" type="submit">Guardar mi voto</button>
            </form>
            <a class="boton volver-salas" href="Salas.html">Volver a la sala</a>
        </section>
    </main>

    <script src="../JS/VotarAhora.js" defer></script>
</body>
</html>
