<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f0cf58">
    <title>Iniciar sesión | Limoncio-Pelicular</title>
    <link rel="stylesheet" href="../CSS/EstilosComunes.css">
    <link rel="stylesheet" href="../CSS/IniciarSesion.css">
</head>
<body>
    <header class="site-header">
        <nav class="site-nav" aria-label="Navegación principal">
            <a class="site-brand" href="Home.html">Limoncio-Pelicular</a>
            <div class="site-nav-links">
                <a href="Aplicacion.html">Aplicación</a>
                <a href="Peliculas.html">Películas</a>
                <a href="Preguntas.html">Preguntas frecuentes</a>
                <a href="SobreNosotros.html">Sobre nosotros</a>
                <a href="Soporte.html">Soporte</a>
                <a href="Salas.html">Salas</a>
            </div>
        </nav>
    </header>

    <main class="page-shell">
        <section class="panel login-panel">
            <p class="eyebrow">Tu cuenta</p>
            <h1>Iniciar sesión</h1>

            <div class="registrarse">
                <a class="boton" href="../Registrarse.html">Registrarse</a>
            </div>

            <form class="login-form" action="">
                <label for="email">Correo electrónico o nombre de usuario:</label>
                <input id="email" name="email" type="text" autocomplete="username" required>

                <label for="password">Contraseña:</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>

                <button class="boton" type="submit">Iniciar sesión</button>
            </form>
        </section>
    </main>
</body>
</html>
