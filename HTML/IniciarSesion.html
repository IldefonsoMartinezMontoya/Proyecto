<!DOCTYPE html>
<!-- Formulario para autenticar a una cuenta existente. -->
<html lang="es">
<!-- Metadatos, título y hojas de estilo de esta página. -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f0cf58">
    <title>Iniciar sesión | Limoncio-Pelicular</title>
    <link rel="stylesheet" href="../CSS/EstilosComunes.css">
    <link rel="stylesheet" href="../CSS/IniciarSesion.css">
</head>
<body>
    <!-- Cabecera compartida: marca y navegación principal. -->
    <header class="site-header">
        <nav class="site-nav" aria-label="Navegación principal">
            <a class="site-brand" href="Home.html">Limoncio-Pelicular</a>
            <div class="site-nav-links">
                <a href="Aplicacion.html">Aplicación</a>
                <a href="Peliculas.html">Películas</a>
                <a href="Preguntas.html">Preguntas frecuentes</a>
                <a href="SobreNosotros.html">Sobre nosotros</a>
                <a href="Soporte.html">Soporte</a>
                <a href="Salas.html">Salas</a>
            </div>
        </nav>
    </header>

    <!-- Contenido central, envuelto para mantener el ancho común del sitio. -->
    <main class="page-shell">
        <!-- Panel visual que contiene el formulario de cuenta. -->
        <section class="panel login-panel">
            <p class="eyebrow">Tu cuenta</p>
            <h1>Iniciar sesión</h1>

            <div class="registrarse">
                <a class="boton" href="Registrarse.html">Registrarse</a>
            </div>

            <!-- Formulario que agrupa campos relacionados para la acción de esta página. -->

            <form class="login-form" id="loginForm">
                <label for="identifier">Correo electrónico o nombre de usuario:</label>
                <input id="identifier" name="identifier" type="text" autocomplete="username" required>

                <label for="password">Contraseña:</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>

                <button class="boton" type="submit">Iniciar sesión</button>
                <p id="loginMensaje" class="form-message" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <!-- Lógica interactiva específica de esta página. -->
    <script src="../JS/IniciarSesion.js" defer></script>
</body>
</html>
